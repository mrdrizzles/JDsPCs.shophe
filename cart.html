<!DOCTYPE html>

<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JDsPCs | Cart</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#000;
color:#fff;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
border-bottom:1px solid #222;
}

.logo{
font-size:2rem;
font-weight:700;
}

.nav-links a{
color:white;
text-decoration:none;
margin-left:25px;
}

.page-title{
text-align:center;
padding:50px 20px;
font-size:3rem;
}

.cart-container{
max-width:1400px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
}

.cart-item{
background:#111;
border:1px solid #222;
padding:25px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.item-details h2{
margin-bottom:10px;
}

.item-price{
color:#aaa;
}

.controls{
display:flex;
align-items:center;
gap:10px;
}

.controls button{
width:40px;
height:40px;
border:none;
background:white;
font-weight:bold;
cursor:pointer;
}

.quantity{
font-size:18px;
width:30px;
text-align:center;
}

.remove-btn{
background:#222 !important;
color:white;
border:1px solid #444 !important;
width:auto !important;
padding:0 15px;
}

.summary{
background:#111;
border:1px solid #222;
padding:30px;
height:fit-content;
position:sticky;
top:20px;
}

.summary h2{
margin-bottom:20px;
}

.total{
font-size:2rem;
font-weight:bold;
margin:20px 0;
}

.checkout-btn{
width:100%;
padding:16px;
background:white;
color:black;
border:none;
font-weight:bold;
cursor:pointer;
}

.clear-btn{
width:100%;
padding:16px;
margin-top:15px;
background:#222;
color:white;
border:1px solid #444;
cursor:pointer;
}

.empty-cart{
text-align:center;
color:#888;
padding:50px;
font-size:1.2rem;
}

@media(max-width:900px){

.cart-container{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">JDsPCs</div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
</div>

</nav>

<h1 class="page-title">Your Cart</h1>

<div class="cart-container">

<div id="cartItems"></div>

<div class="summary">

<h2>Order Summary</h2>

<div id="totalPrice" class="total">
$0
</div>

<button class="checkout-btn"
onclick="window.location.href='checkout.html'">
PROCEED TO CHECKOUT
</button>

<button class="clear-btn" onclick="clearCart()">
Remove
</button>

</div>

</div>

<script>

function renderCart(){

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let cartHTML = "";

let total = 0;

if(cart.length === 0){

cartHTML = `
<div class="empty-cart">
Your cart is currently empty.
</div>
`;

}

cart.forEach((item,index)=>{

total += item.price * item.quantity;

cartHTML += `

<div class="cart-item">

<div class="item-details">

<h2>${item.name}</h2>

<div class="item-price">
$${item.price}
</div>

</div>

<div class="controls">

<button onclick="decreaseQuantity(${index})">
-
</button>

<div class="quantity">
${item.quantity}
</div>

<button onclick="increaseQuantity(${index})">
+
</button>

<button class="remove-btn"
onclick="removeItem(${index})">
Remove
</button>

</div>

</div>

`;

});

document.getElementById("cartItems").innerHTML = cartHTML;

document.getElementById("totalPrice").innerHTML =
"$" + total.toLocaleString();

}

function increaseQuantity(index){

let cart = JSON.parse(localStorage.getItem("cart"));

cart[index].quantity++;

localStorage.setItem("cart",JSON.stringify(cart));

renderCart();

}

function decreaseQuantity(index){

let cart = JSON.parse(localStorage.getItem("cart"));

if(cart[index].quantity > 1){

cart[index].quantity--;

}

localStorage.setItem("cart",JSON.stringify(cart));

renderCart();

}

function removeItem(index){

let cart = JSON.parse(localStorage.getItem("cart"));

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

updateCartCount();

renderCart();

}

function clearCart(){

localStorage.removeItem("cart");

renderCart();

}

renderCart();

</script>

</body>
</html>
