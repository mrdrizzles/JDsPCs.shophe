<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JDsPCs | Shop</title>

<link rel="stylesheet" href="style.css">

<style>

.hero{
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:4rem;
margin-bottom:10px;
}

.hero p{
color:#999;
}

.shop-grid{
max-width:1400px;
margin:auto;
padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
}

.pc-card{
background:#111;
border:1px solid #222;
overflow:hidden;
transition:.3s;
animation:fadeUp .6s ease;
}

.pc-card:hover{
transform:translateY(-10px);
border-color:#555;
}

.pc-card img{
width:100%;
height:240px;
object-fit:cover;
}

.pc-info{
padding:20px;
}

.pc-info h2{
margin-bottom:15px;
}

.spec{
color:#aaa;
margin-bottom:8px;
}

.price{
font-size:2rem;
font-weight:bold;
margin-top:15px;
}

.buy-btn{
width:100%;
padding:15px;
margin-top:20px;
background:white;
color:black;
border:none;
font-weight:bold;
cursor:pointer;
transition:.25s;
}

.buy-btn:hover{
transform:translateY(-4px);
box-shadow:0 0 15px rgba(255,255,255,.25);
}

</style>

</head>

<body>

<nav>

<div class="logo">JDsPCs</div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="cart.html" id="cartLink">
Cart (<span id="cartCount">0</span>)
</a>
</div>

</nav>

<section class="hero">
<h1>PREBUILT PCS</h1>
<p>Built For Gaming. Built For Performance.</p>
</section>

<div class="shop-controls">

    <input
        type="text"
        id="searchInput"
        placeholder="Search PCs..."
        onkeyup="filterProducts()"
    >

    <select id="sortSelect" onchange="sortProducts()">
        <option value="default">Sort By</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
        <option value="name">Name A-Z</option>
    </select>

</div>


<div class="shop-grid">

<div class="pc-card" data-price="1499">
<img src="images/pc1.jpg" alt="Starter Gaming PC">
<div class="pc-info">
<h2>Starter Gaming PC</h2>
<div class="spec">Ryzen 5 7600</div>
<div class="spec">RTX 4060</div>
<div class="spec">32GB DDR5</div>
<div class="spec">1TB NVMe SSD</div>
<div class="price">$1499</div>
<button class="buy-btn" onclick="addToCart('Starter Gaming PC',1499)">BUY NOW</button>
</div>
</div>

<div class="pc-card" data-price="1999">
<img src="images/pc2.jpg" alt="Performance PC">
<div class="pc-info">
<h2>Pro Gaming PC</h2>
<div class="spec">Ryzen 7 7700X</div>
<div class="spec">RTX 4070</div>
<div class="spec">32GB DDR5</div>
<div class="spec">2TB NVMe SSD</div>
<div class="price">$1999</div>
<button class="buy-btn" onclick="addToCart('Performance Gaming PC',1999)">BUY NOW</button>
</div>
</div>


</div>

<script>

function updateCartCount(){

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let count = 0;

cart.forEach(item=>{
count += item.quantity;
});

document.getElementById("cartCount").innerText = count;

}

function addToCart(name, price){

function filterProducts(){

let search =
document.getElementById("searchInput")
.value
.toLowerCase();

let cards =
document.querySelectorAll(".pc-card");

cards.forEach(card=>{

let title =
card.querySelector("h2")
.innerText
.toLowerCase();

if(title.includes(search)){
card.style.display = "block";
}
else{
card.style.display = "none";
}

});

}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let existing = cart.find(item => item.name === name);

if(existing){
existing.quantity++;
}
else{
cart.push({
name:name,
price:price,
quantity:1
});
}

localStorage.setItem("cart", JSON.stringify(cart));

updateCartCount();

window.location.href = "cart.html";

}

updateCartCount();

</script>

</body>
</html>
